name: Monthly Emporia Data Download

on:
  schedule:
    # Runs at 12:00 UTC (4:00 AM / 5:00 AM California time) on the 27th
    - cron: '0 12 27 * *'
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  run-download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Create service-account.json
        run: |
          echo "${{ secrets.GCP_SERVICE_ACCOUNT }}" | base64 --decode > service-account.json

      - name: Create config.yaml
        run: |
          cat <<EOF > config.yaml
          credentials:
            username: "$USER"
            password: "$PASS"
          data:
            granularity: DAY
          output:
            google_sheet_url: https://docs.google.com/spreadsheets/d/1maoCrZuzxQJB8beHq6o9_677UvjJ1khtWLITaRIT_iE/edit?gid=141030202#gid=141030202
            service_account_file: service-account.json
          EOF
        env:
          USER: ${{ secrets.EMPORIA_USERNAME }}
          PASS: ${{ secrets.EMPORIA_PASSWORD }}

      - name: Run script
        run: python download_data.py

      - name: Upload local backup
        uses: actions/upload-artifact@v4
        with:
          name: emporia-data-backup
          path: emporia_data/ # Or whichever folder your script saves to